<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Dashboard - Sistema de Gestión Bancaria</title>

    <link rel="stylesheet" href="./css/styles.css" />
  </head>

  <body class="dashboard-page">
    <main class="dashboard-simple">
      <h1>Mi banca digital</h1>

      <p>
        Bienvenido,
        <strong id="nombreUsuario">Usuario</strong>
      </p>

      <h2>Mi cuenta bancaria</h2>

      <p>
        Número de cuenta:
        <strong id="numeroCuenta">---</strong>
      </p>

      <p>
        Saldo disponible:
        <strong id="saldoCuenta">$0.00</strong>
      </p>

      <button type="button" id="btnCerrarSesion" class="btn btn-primary">
        Cerrar sesión
      </button>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script type="module" src="./js/ui/dashboard.js"></script>
  </body>
</html>
